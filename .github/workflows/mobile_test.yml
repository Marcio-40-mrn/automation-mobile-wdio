name: Mobile Tests — AWS Device Farm

on:
  workflow_dispatch:
  pull_request:

env:
  AWS_DEFAULT_REGION: us-west-2

jobs:
  run-on-device-farm:
    runs-on: ubuntu-latest
    outputs:
      run_arn: ${{ steps.schedule.outputs.run_arn }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      # --- Obter APK do EAS Build ---
      - name: Download APK from latest EAS Build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
          BUILD_PROFILE_ANDROID: ${{ secrets.BUILD_PROFILE_ANDROID }}
          BUILD_SELECTION: ${{ secrets.BUILD_SELECTION }}
          BUILD_FROM: ${{ secrets.BUILD_FROM }}
          BUILD_TO: ${{ secrets.BUILD_TO }}
        run: |
          node scripts/install-apk.mjs --no-install
          echo "APP_VERSION=$(jq -r '.appVersion' .build-info.json)" >> $GITHUB_ENV
          echo "APP_BUILD_VERSION=$(jq -r '.appBuildVersion' .build-info.json)" >> $GITHUB_ENV

      # --- Upload APK para Device Farm ---
      - name: Create APK upload on Device Farm
        id: apk_upload
        run: |
          RESPONSE=$(aws devicefarm create-upload \
            --project-arn "${{ secrets.DEVICE_FARM_PROJECT_ARN }}" \
            --name "app-run${{ github.run_number }}.apk" \
            --type ANDROID_APP \
            --region us-west-2)
          echo "apk_arn=$(echo $RESPONSE | jq -r '.upload.arn')" >> $GITHUB_OUTPUT
          echo "apk_url=$(echo $RESPONSE | jq -r '.upload.url')" >> $GITHUB_OUTPUT

      - name: Upload APK to Device Farm S3
        run: curl -T app.apk "${{ steps.apk_upload.outputs.apk_url }}"

      - name: Wait for APK upload to succeed
        run: |
          ARN="${{ steps.apk_upload.outputs.apk_arn }}"
          for i in $(seq 1 20); do
            STATUS=$(aws devicefarm get-upload --arn "$ARN" --region us-west-2 | jq -r '.upload.status')
            echo "APK upload status ($i/20): $STATUS"
            if [ "$STATUS" = "SUCCEEDED" ]; then exit 0; fi
            if [ "$STATUS" = "FAILED" ]; then echo "APK upload falhou"; exit 1; fi
            sleep 10
          done
          echo "Timeout aguardando upload do APK"; exit 1

      # --- Criar ZIP do test package ---
      - name: Create test package ZIP
        run: |
          zip -r test-package.zip . \
            --exclude "node_modules/*" \
            --exclude ".git/*" \
            --exclude "allure-results/*" \
            --exclude "allure-report/*" \
            --exclude "ctrf/*" \
            --exclude "_results_/*" \
            --exclude "app.apk" \
            --exclude "test-package.zip"
          echo "ZIP criado: $(du -sh test-package.zip | cut -f1)"

      - name: Create test package upload on Device Farm
        id: test_upload
        run: |
          RESPONSE=$(aws devicefarm create-upload \
            --project-arn "${{ secrets.DEVICE_FARM_PROJECT_ARN }}" \
            --name "test-package-run${{ github.run_number }}.zip" \
            --type APPIUM_NODE_TEST_PACKAGE \
            --region us-west-2)
          echo "test_arn=$(echo $RESPONSE | jq -r '.upload.arn')" >> $GITHUB_OUTPUT
          echo "test_url=$(echo $RESPONSE | jq -r '.upload.url')" >> $GITHUB_OUTPUT

      - name: Upload test package to Device Farm S3
        run: curl -T test-package.zip "${{ steps.test_upload.outputs.test_url }}"

      - name: Wait for test package upload to succeed
        run: |
          ARN="${{ steps.test_upload.outputs.test_arn }}"
          for i in $(seq 1 30); do
            STATUS=$(aws devicefarm get-upload --arn "$ARN" --region us-west-2 | jq -r '.upload.status')
            echo "Test package upload status ($i/30): $STATUS"
            if [ "$STATUS" = "SUCCEEDED" ]; then exit 0; fi
            if [ "$STATUS" = "FAILED" ]; then echo "Test package upload falhou"; exit 1; fi
            sleep 15
          done
          echo "Timeout aguardando upload do test package"; exit 1

      # --- Upload testspec ---
      - name: Create testspec upload on Device Farm
        id: testspec_upload
        run: |
          RESPONSE=$(aws devicefarm create-upload \
            --project-arn "${{ secrets.DEVICE_FARM_PROJECT_ARN }}" \
            --name "testspec-run${{ github.run_number }}.yml" \
            --type APPIUM_NODE_TEST_SPEC \
            --region us-west-2)
          echo "spec_arn=$(echo $RESPONSE | jq -r '.upload.arn')" >> $GITHUB_OUTPUT
          echo "spec_url=$(echo $RESPONSE | jq -r '.upload.url')" >> $GITHUB_OUTPUT

      - name: Upload testspec to Device Farm S3
        run: curl -T testspec.yml "${{ steps.testspec_upload.outputs.spec_url }}"

      - name: Wait for testspec upload to succeed
        run: |
          ARN="${{ steps.testspec_upload.outputs.spec_arn }}"
          for i in $(seq 1 10); do
            STATUS=$(aws devicefarm get-upload --arn "$ARN" --region us-west-2 | jq -r '.upload.status')
            echo "Testspec upload status ($i/10): $STATUS"
            if [ "$STATUS" = "SUCCEEDED" ]; then exit 0; fi
            if [ "$STATUS" = "FAILED" ]; then echo "Testspec upload falhou"; exit 1; fi
            sleep 5
          done
          echo "Timeout aguardando upload do testspec"; exit 1

      # --- Agendar run no Device Farm ---
      - name: Schedule Device Farm run
        id: schedule
        env:
          CLIENT_USERS_EMAILS: ${{ secrets.CLIENT_USERS_ANDROID_EMAILS }}
          CLIENT_PASSWORD: ${{ secrets.CLIENT_PASSWORD }}
        run: |
          # Remove qualquer whitespace/quebra de linha que possa ter entrado ao colar o
          # secret (emails+virgula nao tem espaco, entao isso so limpa o valor).
          USERS=$(printf '%s' "$CLIENT_USERS_EMAILS" | tr -d '[:space:]')
          # Um valor vazio aqui vira {"value":""}, que o schedule-run rejeita com um
          # ParamValidation apontando so o indice do array (ver run #2). Falha nomeada.
          for v in CLIENT_PASSWORD USERS APP_VERSION APP_BUILD_VERSION; do
            [ -n "${!v}" ] || { echo "::error::Variavel $v esta vazia — verifique os secrets do repositorio"; exit 1; }
          done
          RUN_ARN=$(aws devicefarm schedule-run \
            --project-arn "${{ secrets.DEVICE_FARM_PROJECT_ARN }}" \
            --app-arn "${{ steps.apk_upload.outputs.apk_arn }}" \
            --device-pool-arn "${{ secrets.DEVICE_FARM_DEVICE_POOL_ARN }}" \
            --name "CI Run #${{ github.run_number }}" \
            --test "{\"type\":\"APPIUM_NODE\",\"testPackageArn\":\"${{ steps.test_upload.outputs.test_arn }}\",\"testSpecArn\":\"${{ steps.testspec_upload.outputs.spec_arn }}\"}" \
            --configuration "{\"environmentVariables\":[{\"name\":\"CLIENT_PASSWORD\",\"value\":\"$CLIENT_PASSWORD\"},{\"name\":\"CLIENT_USERS_EMAILS\",\"value\":\"$USERS\"},{\"name\":\"APP_VERSION\",\"value\":\"${{ env.APP_VERSION }}\"},{\"name\":\"APP_BUILD_VERSION\",\"value\":\"${{ env.APP_BUILD_VERSION }}\"}]}" \
            --region us-west-2 \
            --query 'run.arn' --output text)
          echo "run_arn=$RUN_ARN" >> $GITHUB_OUTPUT
          echo "Run agendado: $RUN_ARN"

      # --- Aguardar conclusão ---
      - name: Wait for Device Farm run to complete
        run: |
          ARN="${{ steps.schedule.outputs.run_arn }}"
          echo "Aguardando run: $ARN"
          STATUS=""
          RESULT_VAL=""
          REACHED_TERMINAL=false
          for i in $(seq 1 120); do
            RESULT=$(aws devicefarm get-run --arn "$ARN" --region us-west-2 | jq -r '.run | "\(.status) \(.result)"')
            STATUS=$(echo $RESULT | cut -d' ' -f1)
            RESULT_VAL=$(echo $RESULT | cut -d' ' -f2)
            echo "Status ($i/120): $STATUS / $RESULT_VAL"
            if [ "$STATUS" != "PENDING" ] && [ "$STATUS" != "RUNNING" ] && [ "$STATUS" != "SCHEDULING" ]; then
              echo "Run concluído com resultado: $RESULT_VAL"
              REACHED_TERMINAL=true
              break
            fi
            sleep 60
          done
          # Timeout sem estado terminal = falha real de automação (esteira travou) -> quebra.
          if [ "$REACHED_TERMINAL" != "true" ]; then
            echo "::error::Timeout aguardando o Device Farm (último status: $STATUS). A esteira não conseguiu obter o resultado."
            exit 1
          fi
          # Resultado do teste (PASSED/FAILED/ERRORED/WARNED) NÃO quebra a esteira: reflete no relatório.
          echo "::notice::Android Device Farm: $RESULT_VAL — ver relatório Allure"
          echo "**Android Device Farm:** \`$RESULT_VAL\` — resultado reflete no relatório, não quebra a esteira." >> "$GITHUB_STEP_SUMMARY"

      # --- Download de artifacts ---
      - name: Download artifacts from Device Farm
        if: always()
        run: |
          RUN_ARN="${{ steps.schedule.outputs.run_arn }}"
          mkdir -p artifacts allure-results

          # O relatório junta TODOS os devices: baixa o "Customer Artifacts" (zip com o
          # allure-results, incl. vídeo) da Tests Suite de CADA device do run. Cada resultado
          # já carrega o rótulo do aparelho/conta (test.spec.ts) para a navegação por device.
          i=0
          for JOB_ARN in $(aws devicefarm list-jobs --arn "$RUN_ARN" --region us-west-2 | jq -r '.jobs[].arn'); do
            NAME=$(aws devicefarm get-job --arn "$JOB_ARN" --region us-west-2 | jq -r '.job.device.name')
            SUITE_ARN=$(aws devicefarm list-suites --arn "$JOB_ARN" --region us-west-2 \
              | jq -r '.suites[] | select(.name=="Tests Suite") | .arn')
            if [ -z "$SUITE_ARN" ] || [ "$SUITE_ARN" = "null" ]; then
              echo "Sem Tests Suite (pulando): $NAME"; i=$((i+1)); continue
            fi
            TEST_ARN=$(aws devicefarm list-tests --arn "$SUITE_ARN" --region us-west-2 | jq -r '.tests[0].arn')
            URL=$(aws devicefarm list-artifacts --arn "$TEST_ARN" --type FILE --region us-west-2 \
              | jq -r '.artifacts[] | select(.name=="Customer Artifacts") | .url')
            if [ -n "$URL" ] && [ "$URL" != "null" ]; then
              curl -sL --retry 3 --max-time 180 "$URL" -o "artifacts/ca-$i.zip" || true
              echo "Baixado Customer Artifacts de: $NAME -> ca-$i.zip"
            else
              echo "Sem Customer Artifacts: $NAME"
            fi
            i=$((i+1))
          done

          echo "Artifacts baixados: $(ls artifacts/ | wc -l) arquivos"
          ls -la artifacts/

      - name: Upload raw Device Farm artifacts (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devicefarm-raw-android-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Extract allure-results from artifacts
        if: always()
        run: |
          # Cada "Customer Artifacts" é um zip com o allure-results aninhado em
          # Host_Machine_Files/$DEVICEFARM_LOG_DIR/allure-results/. Extrai cada zip num subdir
          # próprio e MESCLA todos os allure-results num só. Os arquivos de resultado/anexo têm
          # nome UUID (únicos entre devices), então cp -n (no-clobber) traz todos; os fixos
          # (environment.properties, categories.json, executor.json) ficam com 1 cópia.
          mkdir -p extracted
          n=0
          for f in artifacts/*; do
            [ -f "$f" ] || continue
            if unzip -l "$f" >/dev/null 2>&1; then
              mkdir -p "extracted/dev-$n"
              unzip -o "$f" -d "extracted/dev-$n" >/dev/null 2>&1 || true
              n=$((n+1))
            fi
          done
          find extracted -type d -name allure-results | while read -r d; do
            cp -rn "$d/." allure-results/ 2>/dev/null || true
          done
          echo "Arquivos em allure-results/: $(ls allure-results/ 2>/dev/null | wc -l)"
          ls -la allure-results/ 2>/dev/null || true

      - name: Upload allure-results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ github.run_number }}
          path: allure-results/
          if-no-files-found: warn
          retention-days: 30

  # --- Job iOS Device Farm ---
  run-ios-on-device-farm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      # --- Obter IPA do EAS Build ---
      - name: Download iOS build from latest EAS Build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
          BUILD_PROFILE_IOS: ${{ secrets.BUILD_PROFILE_IOS }}
          BUILD_SELECTION: ${{ secrets.BUILD_SELECTION }}
          BUILD_FROM: ${{ secrets.BUILD_FROM }}
          BUILD_TO: ${{ secrets.BUILD_TO }}
        run: |
          node scripts/install-apk.mjs --no-install --platform ios
          echo "APP_VERSION=$(jq -r '.appVersion' .build-info.json)" >> $GITHUB_ENV
          echo "APP_BUILD_VERSION=$(jq -r '.appBuildVersion' .build-info.json)" >> $GITHUB_ENV

      # --- Upload IPA para Device Farm ---
      - name: Create IPA upload on Device Farm
        id: ipa_upload
        run: |
          RESPONSE=$(aws devicefarm create-upload \
            --project-arn "${{ secrets.DEVICE_FARM_PROJECT_ARN }}" \
            --name "app-ios-run${{ github.run_number }}.ipa" \
            --type IOS_APP \
            --region us-west-2)
          echo "ipa_arn=$(echo $RESPONSE | jq -r '.upload.arn')" >> $GITHUB_OUTPUT
          echo "ipa_url=$(echo $RESPONSE | jq -r '.upload.url')" >> $GITHUB_OUTPUT

      - name: Upload IPA to Device Farm S3
        run: curl -T app.ipa "${{ steps.ipa_upload.outputs.ipa_url }}"

      - name: Wait for IPA upload to succeed
        run: |
          ARN="${{ steps.ipa_upload.outputs.ipa_arn }}"
          for i in $(seq 1 20); do
            STATUS=$(aws devicefarm get-upload --arn "$ARN" --region us-west-2 | jq -r '.upload.status')
            echo "IPA upload status ($i/20): $STATUS"
            if [ "$STATUS" = "SUCCEEDED" ]; then exit 0; fi
            if [ "$STATUS" = "FAILED" ]; then echo "IPA upload falhou"; exit 1; fi
            sleep 10
          done
          echo "Timeout aguardando upload do IPA"; exit 1

      # --- Credenciais e mapa de devices para o host iOS ---
      # O iOS roda UM RUN POR APARELHO. Duas razoes, as duas medidas:
      #
      # 1. As environmentVariables do Device Farm sao do RUN, nao do JOB. Num run com 5 devices
      #    todos recebem exatamente as mesmas variaveis — nao existe "este device usa o email 3".
      # 2. O host iOS nem recebe essas variaveis: o script que a AWS gera monta o proprio
      #    ambiente e exporta so as DEVICEFARM_* (conferido no artefato "Test spec shell script"
      #    do run #6, onde o diagnostico imprimiu CLIENT_USERS_EMAILS len=0).
      #
      # O desenho anterior contornava isso mandando a lista inteira e fazendo cada aparelho
      # descobrir seu indice por (versao de OS, resolucao). Nao funcionou: a API informa a versao
      # completa ("17.3.1") e o host exporta truncada ("17.3"), entao 2 dos 5 nao casavam — e,
      # pior, o codigo ABORTAVA quando nao casava. No CI iOS Run #6 o iPhone 14 e o iPhone 15 Pro
      # Max nao executaram teste nenhum por causa disso.
      #
      # Agora quem decide e o CI: um run por ARN de device, com o email daquele aparelho injetado
      # no testspec do run. Nenhum aparelho fica de fora por nao ser reconhecido.
      - name: Resolver devices e contas do pool iOS
        id: pool_ios
        env:
          CLIENT_USERS_EMAILS: ${{ secrets.CLIENT_USERS_IOS_EMAILS }}
          POOL_ARN: ${{ secrets.DEVICE_FARM_IOS_DEVICE_POOL_ARN }}
        run: |
          # Mesmo tr de antes: o valor colado no secret pode trazer quebra de linha.
          USERS=$(printf '%s' "$CLIENT_USERS_EMAILS" | tr -d '[:space:]')
          if [ -z "$USERS" ]; then
            echo "::error::CLIENT_USERS_IOS_EMAILS esta vazio — verifique os secrets do repositorio"; exit 1
          fi

          # A regra tem que ser por ARN (pool PRIVATE com lista fixa): e o que da uma lista
          # estavel de aparelhos para iterar, com modelo conhecido antes do run.
          ARNS_JSON=$(aws devicefarm get-device-pool --arn "$POOL_ARN" --region us-west-2 \
            --query "devicePool.rules[?attribute=='ARN'].value | [0]" --output text)
          if [ -z "$ARNS_JSON" ] || [ "$ARNS_JSON" = "None" ]; then
            echo "::error::O pool iOS nao tem regra por ARN. A distribuicao de contas depende disso — ajuste o pool para uma lista fixa de devices."
            exit 1
          fi

          : > devices-raw.tsv
          for A in $(printf '%s' "$ARNS_JSON" | jq -r '.[]'); do
            NAME=$(aws devicefarm get-device --arn "$A" --region us-west-2 --query 'device.name' --output text)
            printf '%s\t%s\n' "$NAME" "$A" >> devices-raw.tsv
          done
          # Ordenado por nome para cada aparelho manter a mesma conta entre runs (o Trend do
          # Allure depende dessa estabilidade). Se o pool mudar, o run novo so redistribui — e
          # nenhum device deixa de rodar por causa disso.
          # LC_ALL=C: ordem de BYTE, igual em qualquer locale do runner. Sem isso o collation
          # muda a posicao de "iPhone 14" vs "iPhone 14 Pro Max" e as contas trocariam de dono
          # entre runs, quebrando o Trend.
          LC_ALL=C sort -o devices-raw.tsv devices-raw.tsv

          DEVICES=$(wc -l < devices-raw.tsv | tr -d ' ')
          CONTAS=$(printf '%s' "$USERS" | awk -F, '{print NF}')
          if [ "$DEVICES" -gt "$CONTAS" ]; then
            echo "::error::O pool iOS tem $DEVICES devices e CLIENT_USERS_IOS_EMAILS traz $CONTAS conta(s). Faltam contas — dois aparelhos cairiam na mesma e brigariam pelos favoritos."
            exit 1
          fi

          # devices.tsv: <nome>TAB<arn>TAB<email>. Uma conta por aparelho, na ordem.
          : > devices.tsv
          i=1
          while IFS="$(printf '\t')" read -r NAME A; do
            EMAIL=$(printf '%s' "$USERS" | cut -d, -f"$i")
            if [ -z "$EMAIL" ]; then echo "::error::Sem email para o device $i ($NAME)"; exit 1; fi
            printf '%s\t%s\t%s\n' "$NAME" "$A" "$EMAIL" >> devices.tsv
            i=$((i+1))
          done < devices-raw.tsv
          rm -f devices-raw.tsv

          # Nao imprime o email inteiro: so o prefixo, o bastante para conferir que sao distintos.
          echo "Devices do pool iOS e a conta de cada um:"
          awk -F'\t' '{ split($3, p, "@"); printf "  %s -> %s@...\n", $1, p[1] }' devices.tsv
          echo "devices=$DEVICES" >> $GITHUB_OUTPUT

      # --- Criar ZIP do test package (um so, sem credenciais) ---
      - name: Create test package ZIP
        run: |
          zip -r test-package.zip . \
            --exclude "node_modules/*" \
            --exclude ".git/*" \
            --exclude "allure-results/*" \
            --exclude "allure-report/*" \
            --exclude "ctrf/*" \
            --exclude "_results_/*" \
            --exclude "app.ipa" \
            --exclude "devices.tsv" \
            --exclude "ios-runs.tsv" \
            --exclude "testspec-ios-*.yml" \
            --exclude "test-package.zip"
          echo "ZIP criado: $(du -sh test-package.zip | cut -f1)"
          # As credenciais NAO entram mais no ZIP. Elas variam por aparelho, e o ZIP e o mesmo
          # para os 5 — quem carrega o email de cada um e o testspec do respectivo run.
          if unzip -l test-package.zip | grep -qE ' [.]env$'; then
            echo "::error::.env nao deveria estar no ZIP do test package — as credenciais vao pelo testspec de cada run"
            exit 1
          fi
          echo "ZIP sem .env, como esperado"

      - name: Create test package upload on Device Farm
        id: test_upload_ios
        run: |
          RESPONSE=$(aws devicefarm create-upload \
            --project-arn "${{ secrets.DEVICE_FARM_PROJECT_ARN }}" \
            --name "test-package-ios-run${{ github.run_number }}.zip" \
            --type APPIUM_NODE_TEST_PACKAGE \
            --region us-west-2)
          echo "test_arn=$(echo $RESPONSE | jq -r '.upload.arn')" >> $GITHUB_OUTPUT
          echo "test_url=$(echo $RESPONSE | jq -r '.upload.url')" >> $GITHUB_OUTPUT

      - name: Upload test package to Device Farm S3
        run: curl -T test-package.zip "${{ steps.test_upload_ios.outputs.test_url }}"

      - name: Wait for test package upload to succeed
        run: |
          ARN="${{ steps.test_upload_ios.outputs.test_arn }}"
          for i in $(seq 1 30); do
            STATUS=$(aws devicefarm get-upload --arn "$ARN" --region us-west-2 | jq -r '.upload.status')
            echo "Test package upload status ($i/30): $STATUS"
            if [ "$STATUS" = "SUCCEEDED" ]; then exit 0; fi
            if [ "$STATUS" = "FAILED" ]; then echo "Test package upload falhou"; exit 1; fi
            sleep 15
          done
          echo "Timeout aguardando upload do test package"; exit 1

      # --- Um testspec e um run por aparelho ---
      # O testspec e o unico canal que chega no host iOS com valor por aparelho, e ele ja tinha a
      # funcao de montar o .env. Por isso o email vai nele, e nao num .env dentro do ZIP: um .env
      # por device exigiria 5 ZIPs de ~33 MB, contra 5 arquivos de poucos KB aqui.
      - name: Agendar runs iOS (um por device)
        id: schedule_ios
        env:
          CLIENT_PASSWORD: ${{ secrets.CLIENT_PASSWORD }}
        run: |
          for v in CLIENT_PASSWORD APP_VERSION APP_BUILD_VERSION; do
            if [ -z "${!v}" ]; then echo "::error::Variavel $v esta vazia — verifique os secrets do repositorio"; exit 1; fi
          done
          MARCADOR=$(grep -n '^      - __CREDENCIAIS_DO_RUN__$' testspec-ios.yml | cut -d: -f1)
          if [ -z "$MARCADOR" ]; then
            echo "::error::testspec-ios.yml nao tem a linha __CREDENCIAIS_DO_RUN__ — sem ela nao ha onde injetar a conta do aparelho"
            exit 1
          fi

          : > ios-runs.tsv
          IDX=0
          while IFS="$(printf '\t')" read -r NAME ARN EMAIL; do
            IDX=$((IDX+1))
            SPEC="testspec-ios-$IDX.yml"

            # printf '%q' devolve o valor ja citado para reuso em shell: cobre apostrofo, espaco,
            # aspas, $ e barra invertida na senha ou no email sem corromper o testspec. A
            # substituicao e por head/tail (nao sed/awk) justamente para nao reinterpretar esses
            # escapes uma segunda vez.
            LINE="      - export CLIENT_USER=$(printf '%q' "$EMAIL") CLIENT_PASSWORD=$(printf '%q' "$CLIENT_PASSWORD") DEVICE_LABEL=$(printf '%q' "$NAME") APP_VERSION=$(printf '%q' "$APP_VERSION") APP_BUILD_VERSION=$(printf '%q' "$APP_BUILD_VERSION")"
            {
              head -n $((MARCADOR - 1)) testspec-ios.yml
              printf '%s\n' "$LINE"
              tail -n +$((MARCADOR + 1)) testspec-ios.yml
            } > "$SPEC"

            if grep -q '^      - __CREDENCIAIS_DO_RUN__$' "$SPEC"; then
              echo "::error::marcador nao foi substituido em $SPEC"; exit 1
            fi
            if ! grep -q '^      - export CLIENT_USER=' "$SPEC"; then
              echo "::error::o testspec de $NAME saiu sem a linha de credenciais"; exit 1
            fi

            RESP=$(aws devicefarm create-upload \
              --project-arn "${{ secrets.DEVICE_FARM_PROJECT_ARN }}" \
              --name "testspec-ios-run${{ github.run_number }}-$IDX.yml" \
              --type APPIUM_NODE_TEST_SPEC \
              --region us-west-2)
            SPEC_ARN=$(printf '%s' "$RESP" | jq -r '.upload.arn')
            SPEC_URL=$(printf '%s' "$RESP" | jq -r '.upload.url')
            curl -sS -T "$SPEC" "$SPEC_URL"

            ST=""
            for i in $(seq 1 10); do
              ST=$(aws devicefarm get-upload --arn "$SPEC_ARN" --region us-west-2 --query 'upload.status' --output text)
              if [ "$ST" = "SUCCEEDED" ]; then break; fi
              if [ "$ST" = "FAILED" ]; then echo "::error::upload do testspec de $NAME falhou"; exit 1; fi
              sleep 5
            done
            if [ "$ST" != "SUCCEEDED" ]; then echo "::error::timeout no upload do testspec de $NAME"; exit 1; fi

            # --device-selection-configuration mira UM aparelho pelo ARN, sem precisar criar um
            # device pool de 1 device para cada. Se a AWS recusar este parametro na conta, o
            # plano B e create-device-pool com uma regra ARN/IN por aparelho e --device-pool-arn.
            RUN_ARN=$(aws devicefarm schedule-run \
              --project-arn "${{ secrets.DEVICE_FARM_PROJECT_ARN }}" \
              --app-arn "${{ steps.ipa_upload.outputs.ipa_arn }}" \
              --device-selection-configuration "{\"filters\":[{\"attribute\":\"ARN\",\"operator\":\"IN\",\"values\":[\"$ARN\"]}],\"maxDevices\":1}" \
              --name "CI iOS Run #${{ github.run_number }} - $NAME" \
              --test "{\"type\":\"APPIUM_NODE\",\"testPackageArn\":\"${{ steps.test_upload_ios.outputs.test_arn }}\",\"testSpecArn\":\"$SPEC_ARN\"}" \
              --region us-west-2 \
              --query 'run.arn' --output text)
            if [ -z "$RUN_ARN" ] || [ "$RUN_ARN" = "None" ]; then
              echo "::error::schedule-run falhou para $NAME (ARN $ARN)"; exit 1
            fi

            printf '%s\t%s\n' "$NAME" "$RUN_ARN" >> ios-runs.tsv
            echo "Run agendado: $NAME -> $RUN_ARN"
          done < devices.tsv

          echo "Total de runs iOS agendados: $(wc -l < ios-runs.tsv | tr -d ' ')"

      # --- Aguardar conclusao de todos os runs ---
      # Os runs sao independentes e rodam em paralelo no Device Farm, entao o tempo de parede e o
      # do aparelho mais lento, nao a soma dos cinco.
      - name: Wait for iOS Device Farm runs to complete
        run: |
          if [ ! -s ios-runs.tsv ]; then echo "::error::nenhum run iOS foi agendado"; exit 1; fi
          TOTAL=$(wc -l < ios-runs.tsv | tr -d ' ')
          TERMINOU=false
          for i in $(seq 1 120); do
            echo "Polling ($i/120):"
            PENDENTES=0
            while IFS="$(printf '	')" read -r NAME ARN; do
              LINHA=$(aws devicefarm get-run --arn "$ARN" --region us-west-2 --query 'run.[status,result]' --output text)
              ST=$(printf '%s' "$LINHA" | awk '{print $1}')
              RES=$(printf '%s' "$LINHA" | awk '{print $2}')
              if [ "$ST" != "COMPLETED" ] && [ "$ST" != "STOPPED" ]; then PENDENTES=$((PENDENTES+1)); fi
              echo "  $NAME: $ST / $RES"
            done < ios-runs.tsv
            echo "  -> $PENDENTES de $TOTAL ainda em andamento"
            if [ "$PENDENTES" -eq 0 ]; then TERMINOU=true; break; fi
            sleep 60
          done

          # Timeout sem estado terminal = falha real de automacao (esteira travou) -> quebra.
          if [ "$TERMINOU" != "true" ]; then
            echo "::error::Timeout aguardando os runs iOS ($PENDENTES de $TOTAL ainda em andamento). A esteira nao conseguiu obter o resultado."
            exit 1
          fi

          # Resultado do teste (PASSED/FAILED/ERRORED/WARNED) NAO quebra a esteira: reflete no relatorio.
          echo "### iOS Device Farm — $TOTAL run(s), um por aparelho" >> "$GITHUB_STEP_SUMMARY"
          while IFS="$(printf '\t')" read -r NAME ARN; do
            RES=$(aws devicefarm get-run --arn "$ARN" --region us-west-2 --query 'run.result' --output text)
            echo "- $RES — $NAME" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::iOS $NAME: $RES"
          done < ios-runs.tsv
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Resultado reflete no relatorio Allure; nao quebra a esteira." >> "$GITHUB_STEP_SUMMARY"

      # --- Download de artifacts iOS ---
      - name: Download artifacts from iOS Device Farm runs
        if: always()
        run: |
          mkdir -p artifacts allure-results
          if [ ! -s ios-runs.tsv ]; then echo "Nenhum run iOS para baixar"; exit 0; fi

          # Mesma regra do Android: junta TODOS os aparelhos no relatorio, baixando o "Customer
          # Artifacts" da Tests Suite de cada um. A unica diferenca e o laco externo: antes eram
          # os jobs de 1 run, agora sao os 5 runs — cada um com exatamente 1 job.
          i=0
          while IFS="$(printf '\t')" read -r DEV_NAME RUN_ARN; do
            for JOB_ARN in $(aws devicefarm list-jobs --arn "$RUN_ARN" --region us-west-2 | jq -r '.jobs[].arn'); do
              NAME=$(aws devicefarm get-job --arn "$JOB_ARN" --region us-west-2 | jq -r '.job.device.name')
              SUITE_ARN=$(aws devicefarm list-suites --arn "$JOB_ARN" --region us-west-2 \
                | jq -r '.suites[] | select(.name=="Tests Suite") | .arn')
              if [ -z "$SUITE_ARN" ] || [ "$SUITE_ARN" = "null" ]; then
                echo "Sem Tests Suite (pulando): $NAME"; i=$((i+1)); continue
              fi
              TEST_ARN=$(aws devicefarm list-tests --arn "$SUITE_ARN" --region us-west-2 | jq -r '.tests[0].arn')
              URL=$(aws devicefarm list-artifacts --arn "$TEST_ARN" --type FILE --region us-west-2 \
                | jq -r '.artifacts[] | select(.name=="Customer Artifacts") | .url')
              if [ -n "$URL" ] && [ "$URL" != "null" ]; then
                curl -sL --retry 3 --max-time 180 "$URL" -o "artifacts/ca-$i.zip" || true
                echo "Baixado Customer Artifacts de: $NAME -> ca-$i.zip"
              else
                echo "Sem Customer Artifacts: $NAME"
              fi
              i=$((i+1))
            done
          done < ios-runs.tsv
          echo "Artifacts iOS baixados: $(ls artifacts/ | wc -l) arquivos"

      - name: Upload raw iOS Device Farm artifacts (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devicefarm-raw-ios-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Extract allure-results from iOS artifacts
        if: always()
        run: |
          # Cada "Customer Artifacts" é um zip com o allure-results aninhado. Extrai cada um num
          # subdir próprio e MESCLA todos num só (cp -n: arquivos UUID únicos entram todos; os
          # fixos ficam com 1 cópia).
          mkdir -p extracted
          n=0
          for f in artifacts/*; do
            [ -f "$f" ] || continue
            if unzip -l "$f" >/dev/null 2>&1; then
              mkdir -p "extracted/dev-$n"
              unzip -o "$f" -d "extracted/dev-$n" >/dev/null 2>&1 || true
              n=$((n+1))
            fi
          done
          find extracted -type d -name allure-results | while read -r d; do
            cp -rn "$d/." allure-results/ 2>/dev/null || true
          done
          echo "Arquivos em allure-results/ (iOS): $(ls allure-results/ 2>/dev/null | wc -l)"
          ls -la allure-results/ 2>/dev/null || true

      - name: Upload iOS allure-results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-ios-${{ github.run_number }}
          path: allure-results/
          if-no-files-found: warn
          retention-days: 30

  # --- Job de publicação do relatório ---
  publish-report:
    needs: [run-on-device-farm, run-ios-on-device-farm]
    runs-on: ubuntu-latest
    if: always()
    # Rede de segurança: a publicação leva poucos minutos. Sem esse teto, um step que
    # trave pendura o run por horas (já aconteceu num step de re-encode de vídeo).
    timeout-minutes: 45
    permissions:
      contents: write
    # Serializa publicações de runs sobrepostas para evitar corrida de push na branch reports.
    concurrency:
      group: reports-publish
      cancel-in-progress: false
    # Quantas execuções ficam publicadas na branch reports (as N mais recentes).
    env:
      REPORTS_KEEP: 3

    steps:
      - name: Checkout main (para ter os scripts)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install allure-commandline
        run: npm install -g allure-commandline

      - name: Download Android allure-results artifact
        uses: actions/download-artifact@v4
        with:
          name: allure-results-${{ github.run_number }}
          path: allure-results-android/
        continue-on-error: true

      - name: Download iOS allure-results artifact
        uses: actions/download-artifact@v4
        with:
          name: allure-results-ios-${{ github.run_number }}
          path: allure-results-ios/
        continue-on-error: true

      - name: Checkout reports branch
        uses: actions/checkout@v4
        with:
          ref: reports
          path: reports-branch
          # fetch-depth: 1 — só a árvore do commit mais recente (já contém todos os run-N/).
          # Evita baixar todo o histórico pesado da branch (relatórios + vídeos), que corrompia
          # o checkout e causava "fatal: could not parse HEAD" no commit.
          fetch-depth: 1

      - name: Copy Allure history per platform (Trend tab)
        run: |
          # Cada plataforma acumula só o seu histórico: lê do último run que tenha
          # a subpasta da plataforma. Roda ANTES de criar o diretório do run atual.
          LATEST=$(ls reports-branch/ | grep "^run-" | sort -V | tail -1)
          for PLAT in android ios; do
            SRC="reports-branch/$LATEST/$PLAT/history"
            if [ -n "$LATEST" ] && [ -d "$SRC" ]; then
              mkdir -p "allure-results-$PLAT/history"
              cp -r "$SRC/." "allure-results-$PLAT/history/"
              echo "Histórico $PLAT copiado de: $LATEST"
            else
              echo "Nenhum histórico $PLAT anterior encontrado"
            fi
          done

      # NÃO reintroduzir um step de re-encode de vídeo (ffmpeg) aqui. Ele nunca entregou
      # nada: na primeira versão morria no apt-get sob continue-on-error (no-op silencioso)
      # e, quando passou a rodar de verdade, o ffmpeg sem -nostdin lia a stdin do loop
      # `find ... | while read` e travava no handler interativo ("Enter command: ..."),
      # pendurando o run por horas. O .mp4 do Appium é publicado como está: o Android grava
      # em H.264 via MediaProjection, que o navegador toca nativamente.

      - name: Generate Allure HTML reports per platform
        run: |
          # "Tem resultado" = existe pelo menos um *-result.json. Diretório não-vazio não serve
          # como critério: um job que falhou antes do Device Farm ainda deixa a pasta com os
          # arquivos fixos (environment.properties/categories.json) e o history/ copiado acima,
          # e o Allure gera dali um relatório de 0 testes — que era publicado e consumia um
          # slot da retenção, derrubando um relatório real.
          for PLAT in android ios; do
            SRC="allure-results-$PLAT"
            COUNT=$(find "$SRC" -name '*-result.json' 2>/dev/null | wc -l)
            if [ "$COUNT" -gt 0 ]; then
              allure generate "./$SRC" --clean -o "./allure-report-$PLAT"
              echo "Relatório $PLAT gerado ($COUNT resultados)"
            else
              NOME=$([ "$PLAT" = "android" ] && echo Android || echo iOS)
              echo "::warning::$NOME sem resultados — relatório não gerado."
              echo "**$NOME:** nenhum resultado — o job não chegou a agendar run no Device Farm." >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Generate Allure single-file reports (baixável)
        if: always()
        run: |
          # Mesmo critério do passo anterior: só gera com resultado de teste real.
          for PLAT in android ios; do
            SRC="allure-results-$PLAT"
            if [ "$(find "$SRC" -name '*-result.json' 2>/dev/null | wc -l)" -gt 0 ]; then
              allure generate "./$SRC" --clean --single-file -o "./allure-single-$PLAT"
              echo "Single-file $PLAT em ./allure-single-$PLAT/index.html"
            else
              echo "Sem resultados $PLAT — pulando single-file"
            fi
          done

      - name: Upload Android Allure report (single-file) como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-android-${{ github.run_number }}
          path: allure-single-android/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload iOS Allure report (single-file) como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-ios-${{ github.run_number }}
          path: allure-single-ios/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish reports to reports branch
        if: always()
        run: |
          RUN_DIR="run-${{ github.run_number }}-$(date -u +%Y-%m-%d)"
          KEEP="$REPORTS_KEEP"

          # --- Guarda: nada gerado -> não publica, mas explica claramente o motivo ---
          if [ ! -d "allure-report-android" ] && [ ! -d "allure-report-ios" ]; then
            MSG="Device Farm não retornou allure-results (Android nem iOS) — relatório não publicado nesta run."
            echo "::error::$MSG"
            echo "**Publicação:** $MSG" >> "$GITHUB_STEP_SUMMARY"
            # exit 1, não 0: sem resultado o relatório do Pages para de ser atualizado, e um
            # job verde esconde isso (foi o que aconteceu no run-22, 2026-09-01 — a quebra só
            # apareceu quando alguém abriu o log). Falhar aqui deixa o run vermelho na hora.
            exit 1
          fi

          cd reports-branch
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # (Re)aplica a contribuição desta run sobre a árvore ATUAL da branch reports.
          # É idempotente: pode rodar de novo após re-sincronizar com o remoto.
          apply_changes() {
            for PLAT in android ios; do
              if [ -d "../allure-report-$PLAT" ]; then
                rm -rf "$RUN_DIR/$PLAT"
                mkdir -p "$RUN_DIR/$PLAT"
                cp -r "../allure-report-$PLAT/." "$RUN_DIR/$PLAT/"
                echo "Copiado $PLAT para: $RUN_DIR/$PLAT"
              else
                echo "Sem relatório $PLAT para copiar"
              fi
            done
          }

          # Mantém apenas as $KEEP execuções mais recentes. A run atual é sempre a de maior
          # número, então nunca é podada. `find -printf` não depende de glob (sem diretório
          # o padrão viraria o literal "run-*/") e `sort -V` ordena run-49 antes de run-100.
          prune_old_runs() {
            local DIRS
            DIRS=$(find . -maxdepth 1 -type d -name 'run-*' -printf '%f\n' | sort -V | head -n -"$KEEP")
            if [ -z "$DIRS" ]; then
              echo "Nada a podar (branch com no máximo $KEEP runs)."
              return 0
            fi
            while IFS= read -r d; do
              [ -z "$d" ] && continue
              echo "Removendo run antigo: $d"
              rm -rf "$d"
            done <<< "$DIRS"
          }

          # A branch reports é recriada a cada publicação como UM commit órfão com
          # apenas as $KEEP execuções mais recentes. Só apagar os runs antigos
          # não devolveria espaço: os vídeos continuariam no histórico e o repositório
          # seguiria crescendo ~1GB por execução.
          n=0
          while true; do
            # Árvore atualmente publicada, para detectar "nada mudou" (ver abaixo).
            OLD_TREE=$(git rev-parse HEAD^{tree})

            apply_changes
            prune_old_runs
            node ../scripts/generate-report-index.mjs .
            # Remove anexos > 95MB (limite de 100MB por arquivo do GitHub).
            # Exclui .git/ — caso contrário o packfile (>95MB com vídeos acumulados)
            # é apagado e o git seguinte falha com "fatal: could not parse HEAD".
            find . -path './.git' -prune -o -type f -size +95M -print0 | xargs -0 -r rm -f

            # --orphan descarta o histórico (e os vídeos já podados) da branch.
            git checkout -q --orphan "publish-$n"
            git add -A
            git commit -q -m "Relatório: $RUN_DIR (últimos $KEEP runs)"

            # Num commit órfão não há pai, então `git status`/`git diff --staged` nunca
            # ficam vazios. A comparação de "nada novo" é feita pelo hash da árvore.
            if [ "$(git rev-parse HEAD^{tree})" = "$OLD_TREE" ]; then
              echo "Árvore idêntica à já publicada — nada novo para publicar."
              echo "**Publicação:** nada novo para publicar nesta run." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            if git push --force origin HEAD:reports; then
              echo "Relatório publicado com sucesso."
              echo "**Publicação:** relatório \`$RUN_DIR\` publicado na branch reports (mantidos os $KEEP mais recentes)." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            n=$((n+1))
            if [ "$n" -ge 5 ]; then
              echo "::error::Falha ao publicar o relatório após 5 tentativas (push rejeitado pelo remoto)."
              echo "**Publicação:** FALHOU após 5 tentativas de push na branch reports." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "Push rejeitado (corrida com outra run) — re-sincronizando com o remoto (tentativa $n/5)"
            git fetch --depth 1 origin reports
            git reset --hard FETCH_HEAD
            # Sem o clean, arquivos não rastreados da tentativa anterior sobrevivem ao
            # reset e sujam a árvore da tentativa seguinte.
            git clean -fdq
          done

      - name: Print report URL
        run: |
          REPO="${{ github.repository }}"
          OWNER=$(echo $REPO | cut -d'/' -f1 | tr '[:upper:]' '[:lower:]')
          REPO_NAME=$(echo $REPO | cut -d'/' -f2)
          RUN_DIR="run-${{ github.run_number }}-$(date -u +%Y-%m-%d)"
          echo ""
          echo "1) Online (GitHub Pages):"
          echo "   Android: https://${OWNER}.github.io/${REPO_NAME}/${RUN_DIR}/android/"
          echo "   iOS:     https://${OWNER}.github.io/${REPO_NAME}/${RUN_DIR}/ios/"
          echo "   Índice de todos os runs: https://${OWNER}.github.io/${REPO_NAME}/"
          echo ""
          echo "2) Download: aba Actions deste run -> artifacts"
          echo "   'allure-report-android-${{ github.run_number }}' e 'allure-report-ios-${{ github.run_number }}'"
          echo "   Baixe o ZIP, extraia e abra index.html (autocontido, sem servidor)."
