version: 0.1
phases:
  install:
    commands:
      # O host iOS roda Node 14 por padrao, que quebra o WDIO 9. Seleciona Node 18 via nvm.
      - export NVM_DIR=$HOME/.nvm
      - '[ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"'
      - nvm install 18 && nvm use 18
      - node -v

  pre_test:
    commands:
      - export NVM_DIR=$HOME/.nvm
      - '[ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"'
      - nvm use 18
      - cd $DEVICEFARM_TEST_PACKAGE_PATH
      # NUNCA declare "appium" no package.json. Isso derrubou o run-22 (2026-09-01).
      # O Appium usado aqui é o do HOST (v2.11.5, host iOS, Node 18), que já vem com o driver
      # pré-instalado no APPIUM_HOME padrão dele. Mas o Appium AUTODETECTA o APPIUM_HOME:
      # se o package.json do diretório atual declarar "appium" como dependência, ele passa a
      # usar ESSE diretório como APPIUM_HOME. Como a fase roda dentro de
      # $DEVICEFARM_TEST_PACKAGE_PATH, declarar "appium" no package.json fez o log virar
      #   The autodetected Appium home path: .../test-package-xxxx
      #   No drivers have been installed in .../test-package-xxxx
      # e toda criação de sessão falhou com "Could not find a driver for automationName
      # 'UiAutomator2'/'XCUITest'". Zero teste executado, nenhum *-result.json gerado, o job
      # publish-report caiu na guarda "Device Farm não retornou allure-results" e o relatório
      # do GitHub Pages parou de ser atualizado.
      # Só a DECLARAÇÃO no package.json importa — o appium içado para node_modules como
      # dependência transitiva do appium-uiautomator2-driver não dispara a autodetecção.
      # Os avisos npm EBADENGINE (host em Node 18) são inofensivos: o npm install conclui.
      # Retry no npm install: o host do Device Farm às vezes derruba a conexão baixando
      # pacotes (ECONNRESET) → sem deps o `npm run wdio` dá "wdio: command not found", o
      # teste nem roda e o device some do relatório. Tenta até 3x; se esgotar, erra claro aqui.
      - |
        n=0
        until npm install; do
          n=$((n+1))
          if [ $n -ge 3 ]; then echo "npm install falhou após 3 tentativas"; exit 1; fi
          echo "npm install falhou (tentativa $n) — nova tentativa em 10s"; sleep 10
        done
      # Credenciais DESTE run. O iOS roda um run POR APARELHO (5 runs de 1 device), e o
      # workflow injeta abaixo o email daquele aparelho, substituindo a linha marcadora
      # __CREDENCIAIS_DO_RUN__ por um "export". Assim cada device loga com uma conta diferente
      # sem precisar se identificar — ver o cabecalho do test/utils/credentials.ts.
      #
      # Motivo de ser aqui e nao nas environmentVariables do run: o host iOS NAO recebe as
      # environmentVariables — o script que o Device Farm gera monta o proprio ambiente e
      # exporta so as DEVICEFARM_* (conferido no artefato "Test spec shell script" do run #6,
      # onde o diagnostico imprimiu CLIENT_USERS_EMAILS len=0). No host Android o ambiente e
      # herdado do agente e as variaveis chegam; aqui nao.
      - __CREDENCIAIS_DO_RUN__
      # As fases do testspec nao compartilham shell (por isso o "nvm use"/"cd" se repetem em
      # cada uma), entao o export acima nao sobrevive ate a fase "test". Quem atravessa e o
      # .env, lido pelo dotenv.config() do wdio.conf.ts.
      # O diagnostico imprime o COMPRIMENTO das credenciais, nunca o conteudo.
      - |
        [ -n "$CLIENT_USER" ] || { echo "ERRO: CLIENT_USER ausente - o workflow nao substituiu a linha __CREDENCIAIS_DO_RUN__ do testspec (step 'Agendar runs iOS (um por device)')"; exit 1; }
        [ -n "$CLIENT_PASSWORD" ] || { echo "ERRO: CLIENT_PASSWORD ausente - idem"; exit 1; }
        {
          echo "CLIENT_USER=$CLIENT_USER"
          echo "CLIENT_PASSWORD=$CLIENT_PASSWORD"
          echo "DEVICE_LABEL=$DEVICE_LABEL"
          echo "APP_VERSION=$APP_VERSION"
          echo "APP_BUILD_VERSION=$APP_BUILD_VERSION"
        } > .env
        echo "[diag] .env do run: CLIENT_USER len=${#CLIENT_USER} CLIENT_PASSWORD len=${#CLIENT_PASSWORD} DEVICE_LABEL=$DEVICE_LABEL"
      # Ambiente customizado nao sobe o Appium sozinho: inicia em background com base path /wd/hub
      - >-
        appium --base-path=/wd/hub --log-timestamp --relaxed-security
        >> $DEVICEFARM_LOG_DIR/appium.log 2>&1 &
      # Aguarda o Appium ficar pronto
      - |
        t=0
        while true; do
          if [ $t -gt 60 ]; then echo "Appium nao iniciou em 60s"; exit 1; fi
          if grep -iq "Appium REST http interface listener started" $DEVICEFARM_LOG_DIR/appium.log 2>/dev/null; then
            echo "Appium pronto"; break
          fi
          echo "Aguardando Appium..."; sleep 1; t=$((t+1))
        done

  test:
    commands:
      - export NVM_DIR=$HOME/.nvm
      - '[ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"'
      - nvm use 18
      - cd $DEVICEFARM_TEST_PACKAGE_PATH
      - export PLATFORM=ios
      - npm run wdio

  post_test:
    commands:
      - cd $DEVICEFARM_TEST_PACKAGE_PATH
      - 'cp -r ./allure-results $DEVICEFARM_LOG_DIR/allure-results 2>/dev/null || true'
      - 'cp -r ./ctrf $DEVICEFARM_LOG_DIR/ctrf 2>/dev/null || true'

artifacts:
  - $DEVICEFARM_LOG_DIR
